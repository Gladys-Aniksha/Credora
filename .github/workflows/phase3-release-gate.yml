name: Phase 3 Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure ephemeral test secrets
        shell: bash
        run: |
          echo "CREDORA_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "CREDORA_JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "CREDORA_MODEL_ENCRYPTION_KEY=$(python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CI analysis tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff lint checks
        run: ruff check --select E4,E7,E9,F --ignore E402 core modules scripts api dashboard tests
      - name: Run mypy type checks
        run: mypy --ignore-missing-imports --explicit-package-bases --disable-error-code=arg-type --disable-error-code=var-annotated --disable-error-code=misc core modules scripts api
      - name: Run Bandit security scan
        run: bandit -q -lll -r core modules scripts api dashboard
      - name: Run Credora verification suite
        run: python scripts/verify_project.py --skip-scan

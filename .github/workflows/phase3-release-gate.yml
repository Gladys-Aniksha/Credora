name: Phase 3 Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run Phase 3 model release gate
        run: python scripts/phase3_release_gate.py --minimum-score 85
      - name: Build production container
        run: docker build --tag credora:${{ github.sha }} .

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#302526;background:transparent}button,input{accent-color:#a23438}button{cursor:pointer;background:#fff9f7aa;border:1px solid #d9aaa6;border-radius:6px;color:#923038;width:34px;height:32px;font-size:18px}button:hover{background:#f5d9d5}button:focus-visible{outline:2px solid #a23438;outline-offset:2px}.surface{position:relative;border:1px solid #ffffffdc;border-radius:8px;background:linear-gradient(125deg,#ffffff98,#f3c3c34a 55%,#ffffff60);box-shadow:0 12px 32px #79414720,inset 0 2px 0 #ffffff,inset 0 -1px 0 #b4696920;backdrop-filter:blur(24px);padding:20px;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;gap:14px}h3{margin:0;font-size:18px;font-weight:600}.controls{display:flex;align-items:center;gap:8px}.toggle{font-size:12px;display:flex;align-items:center;gap:5px}.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:center;margin-top:16px}.gauge{position:relative;text-align:center;border-right:1px solid #e8c9c760;padding-right:20px}.gauge svg{width:100%;height:165px}.score{font-size:36px;font-weight:600;margin-top:-25px}.score small{font-size:13px;color:#756669;font-weight:400}.label{color:#756669;font-size:12px;margin-top:7px}.delta{font-size:13px;min-height:18px;margin-top:10px}.gate{display:inline-block;color:#923038;background:#f4dad780;padding:6px 10px;border-radius:5px;font-size:12px;margin-top:12px}.chart{min-width:0;position:relative}canvas{width:100%;height:240px;display:block}.legend{display:flex;gap:18px;font-size:12px;color:#756669;margin:10px 0 0 42px;flex-wrap:wrap}.legend i{display:inline-block;width:15px;border-top:2px solid #a23438;vertical-align:middle;margin-right:6px}.legend .reference{border-color:#74838b;border-top-style:dashed}.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px;color:#756669}.foot input{flex:1;min-width:30px}.tooltip{position:absolute;display:none;pointer-events:none;background:#fffdfbf2;border:1px solid #e3c2bf;border-radius:6px;padding:10px;font-size:12px;line-height:1.7;box-shadow:0 4px 12px #34202015;max-width:240px;z-index:2}.empty{font-size:12px;color:#756669;margin-top:8px} @media(max-width:650px){.grid{grid-template-columns:1fr;gap:12px}.gauge{border-right:0;padding:0}.gauge svg{max-width:240px}.surface{padding:14px}.header{align-items:flex-start}h3{font-size:16px}.controls{flex-wrap:wrap;justify-content:flex-end}.chart canvas{height:230px}.legend{margin-left:35px}}
.surface{background:#fffdfb;border:1px solid #eadbd4;box-shadow:none;backdrop-filter:none}.gauge{border-color:#eadbd4}
</style></head><body>
<section class="surface" aria-label="Assessment comparison">
 <div class="header"><h3>Assessment comparison</h3><span class="label">Latest assessment vs previous scan</span></div>
 <div class="grid"><div class="gauge"><svg viewBox="0 0 250 165" role="img" aria-label="Trust score gauge"><path d="M30 132 A95 95 0 0 1 220 132" fill="none" stroke="#ead5d3" stroke-width="17"/><path d="M30 132 A95 95 0 0 1 220 132" fill="none" stroke="#a23438" stroke-width="17" pathLength="100" id="arc" stroke-dasharray="0 100"/><g id="needle" transform="rotate(-90 125 132)"><path d="M125 132 L125 48" stroke="#733238" stroke-width="3.5" stroke-linecap="round"/><circle cx="125" cy="132" r="7" fill="#733238"/></g><text x="24" y="157" fill="#756669" font-size="11">0</text><text x="210" y="157" fill="#756669" font-size="11">100</text></svg><div class="score"><span id="score">--</span><small> / 100</small></div><div class="label" id="label"></div><div class="delta" id="delta"></div><div class="gate" id="gate"></div></div>
 <div class="chart"><canvas id="chart" role="img" aria-label="Assessment stage scores compared with the reference assessment"></canvas><div id="tooltip" class="tooltip"></div><div class="legend"><span><i></i>Current assessment</span><span id="referenceLegend"><i class="reference"></i>Previous assessment</span></div><div class="empty" id="empty"></div></div></div>
 <div class="foot"><span id="progress"></span><span id="mode"></span></div>
</section>
<script>
const data=__ASSESSMENT_DATA__;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=id=>document.getElementById(id), canvas=el('chart'), ctx=canvas.getContext('2d');
const storageKey='credora-motion-'+data.identity;
let prior=null;try{prior=JSON.parse(sessionStorage.getItem(storageKey));}catch(e){}
let fraction=reduced?1:0, shown=prior&&data.live?prior.score:0, frame=null, showReference=true;
const target=data.score;
el('label').textContent=data.live?'Provisional score · completed checks only':'Final assessment score';
el('gate').textContent=data.gate;
el('mode').textContent=data.live?'Live assessment':'Stage results';
el('empty').textContent=data.hasBaseline?'':'No previous compatible assessment. Scan this model again to establish a reference.';
el('referenceLegend').hidden=!data.hasBaseline;
function resize(){const rect=canvas.getBoundingClientRect();const scale=devicePixelRatio||1;canvas.width=rect.width*scale;canvas.height=rect.height*scale;ctx.setTransform(scale,0,0,scale,0,0);draw();parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+6},'*');}
function coords(index,value){const w=canvas.clientWidth,h=canvas.clientHeight;return [42+index*(w-60)/Math.max(data.points.length-1,1),18+(100-value)*(h-52)/100];}
function line(field,color,dashed){ctx.strokeStyle=color;ctx.lineWidth=2.1;ctx.setLineDash(dashed?[5,5]:[]);let connected=false;ctx.beginPath();data.points.forEach((point,i)=>{if(field==='current'&&i>fraction*(data.points.length-1)){const last=data.points[i-1];if(connected&&last&&last[field]!==null&&point[field]!==null){const partial=fraction*(data.points.length-1)-(i-1);if(partial>0){const a=coords(i-1,last[field]),b=coords(i,point[field]);ctx.lineTo(a[0]+(b[0]-a[0])*partial,a[1]+(b[1]-a[1])*partial);}}return;}const value=point[field];if(value===null){connected=false;return;}const [x,y]=coords(i,value);if(connected)ctx.lineTo(x,y);else ctx.moveTo(x,y);connected=true;});ctx.stroke();ctx.setLineDash([]);}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.font='11px Arial';ctx.fillStyle='#756669';[0,25,50,75,100].forEach(v=>{const y=coords(0,v)[1];ctx.strokeStyle='#e8d3d170';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(42,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText(v,10,y+4);});if(data.hasBaseline&&showReference)line('baseline','#74838b',true);line('current','#a23438',false);data.points.forEach((p,i)=>{if(i>fraction*(data.points.length-1)||p.current===null)return;const[x,y]=coords(i,p.current);if(showReference&&p.baseline!==null){const by=coords(i,p.baseline)[1];ctx.strokeStyle='#bd68684d';ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x,y);ctx.stroke();}ctx.fillStyle='#a23438';ctx.beginPath();ctx.arc(x,y,3.4,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#756669';ctx.fillText('Integrity',42,h-9);ctx.fillText('Assessment stages',Math.max(42,w/2-45),h-9);ctx.textAlign='right';ctx.fillText('Runtime',w-12,h-9);ctx.textAlign='left';el('needle').setAttribute('transform',`rotate(${-90+(shown||0)*1.8} 125 132)`);el('arc').setAttribute('stroke-dasharray',`${shown||0} 100`);el('score').textContent=target===null?'--':shown.toFixed(1);el('progress').textContent=`${data.completed}/${data.points.length} checks`;const delta=target!==null&&data.baselineScore!==null?shown-data.baselineScore:null;el('delta').textContent=delta===null?'':`${delta>=0?'+':''}${delta.toFixed(1)} vs previous Trust Score`;el('delta').style.color=delta>=0?'#2f7252':'#a23438';}
function animate(){cancelAnimationFrame(frame);const start=performance.now(),from=shown,to=target||0;function tick(now){const t=reduced?1:Math.min((now-start)/1400,1),ease=1-Math.pow(1-t,3);fraction=t;shown=from+(to-from)*ease;draw();if(t<1)frame=requestAnimationFrame(tick);else{try{sessionStorage.setItem(storageKey,JSON.stringify({score:target}));}catch(e){}}}frame=requestAnimationFrame(tick);}
canvas.onpointermove=event=>{const rect=canvas.getBoundingClientRect();const i=Math.max(0,Math.min(data.points.length-1,Math.round((event.clientX-rect.left-42)/(rect.width-60)*(data.points.length-1))));const p=data.points[i];const tip=el('tooltip');tip.replaceChildren();const title=document.createElement('strong');title.textContent=p.label;tip.append(title,document.createElement('br'));const delta=p.current!==null&&p.baseline!==null?p.current-p.baseline:null;tip.append(document.createTextNode(`Current: ${p.current===null?'Pending / not applicable':p.current.toFixed(1)} · Baseline: ${p.baseline===null?'Unavailable':p.baseline.toFixed(1)}`));if(delta!==null){tip.append(document.createElement('br'),document.createTextNode(`Difference: ${delta>=0?'+':''}${delta.toFixed(1)}`));}tip.style.display='block';tip.style.left=Math.max(0,Math.min(event.clientX-rect.left,rect.width-240))+'px';tip.style.top='20px';};canvas.onpointerleave=()=>el('tooltip').style.display='none';new ResizeObserver(resize).observe(canvas);resize();let entered=false;new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&!entered){entered=true;animate();}},{threshold:.15}).observe(document.querySelector('.surface'));
</script></body></html>

services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      CREDORA_API_KEY: ${CREDORA_API_KEY:?Set CREDORA_API_KEY in the gitignored .env file}
      CREDORA_JWT_SECRET: ${CREDORA_JWT_SECRET:?Set CREDORA_JWT_SECRET in the gitignored .env file}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      CREDORA_API_KEY: ${CREDORA_API_KEY:?Set CREDORA_API_KEY in the gitignored .env file}
      CREDORA_JWT_SECRET: ${CREDORA_JWT_SECRET:?Set CREDORA_JWT_SECRET in the gitignored .env file}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
